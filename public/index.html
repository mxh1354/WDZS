<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能问答助手</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#1F3E77;--primary-light:#2E5A9E;--primary-bg:#E6F1FB;--success:#3B6D11;--warning:#854F0B;--danger:#A32D2D;--text:#1A1A1A;--text-secondary:#5F5E5A;--text-tertiary:#888780;--bg:#FFFFFF;--surface:#F8F7F4;--border:#E0DED7;--font:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;--radius:12px;--radius-sm:8px}
html,body{height:100%;font-family:var(--font);background:linear-gradient(135deg,#f8f7f4 0%,#eeedf8 100%);color:var(--text)}
body{display:flex;align-items:center;justify-content:center;padding:20px}
.app{width:100%;max-width:440px;height:calc(100vh - 40px);max-height:800px;background:var(--bg);border-radius:var(--radius);box-shadow:0 8px 40px rgba(0,0,0,.08);display:flex;flex-direction:column;overflow:hidden}
.header{padding:20px 24px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.header h1{font-size:18px;font-weight:600;color:var(--primary)}
.header p{font-size:13px;color:var(--text-secondary);margin-top:4px}
.dir-picker{padding:12px 16px;display:flex;gap:8px;flex-shrink:0}
.dir-btn{flex:1;padding:10px 8px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);cursor:pointer;text-align:center;transition:all .2s;color:var(--text-secondary);font-weight:500;font-size:13px}
.dir-btn:hover{border-color:var(--primary-light);color:var(--primary-light)}
.dir-btn.active{background:var(--primary-bg);border-color:var(--primary);color:var(--primary)}
.dir-btn .icon{font-size:18px;display:block;margin-bottom:2px}
.msg-area{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{max-width:85%;padding:10px 14px;border-radius:var(--radius);font-size:14px;line-height:1.6;animation:fadeIn .3s ease;word-wrap:break-word;white-space:pre-wrap}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface);border-bottom-left-radius:4px}
.msg.stages{align-self:flex-start;background:#F5F4EE;border-left:3px solid var(--primary);font-size:12px;padding:8px 12px;max-width:90%;color:var(--text-secondary)}
.msg.stages .stage{display:flex;align-items:center;gap:6px;padding:2px 0}
.msg.stages .stage .dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0}
.msg.stages .stage.done .dot{background:var(--success)}
.msg.stages .stage.active .dot{background:var(--primary);animation:pulse 1.2s infinite}
.msg.stages .stage.failed .dot{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
.msg .meta{font-size:11px;color:var(--text-tertiary);margin-top:4px}
.msg.user .meta{color:rgba(255,255,255,.6)}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-tertiary);padding:40px;text-align:center;line-height:1.6;font-size:13px}
.empty-state svg{width:48px;height:48px;fill:var(--border);margin-bottom:8px}
.input-area{padding:12px 16px 16px;border-top:1px solid var(--border);flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-row textarea{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:var(--font);resize:none;outline:none;transition:border .2s;line-height:1.4;max-height:120px}
.input-row textarea:focus{border-color:var(--primary)}
.input-row button{width:40px;height:40px;border-radius:50%;border:none;background:var(--primary);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0}
.input-row button:hover:not(:disabled){background:var(--primary-light)}
.input-row button:disabled{background:var(--border);cursor:not-allowed}
.input-row button svg{width:18px;height:18px;fill:currentColor}
.error-msg{position:absolute;bottom:80px;left:16px;right:16px;padding:10px 14px;background:#FCEBEB;color:var(--danger);border-radius:var(--radius-sm);font-size:13px;display:none;z-index:10;animation:fadeIn .3s ease}
@media(max-width:480px){body{padding:0}.app{height:100vh;max-height:none;border-radius:0}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>智能问答助手</h1>
    <p>请选择方向后开始提问</p>
  </div>
  <div class="dir-picker" id="dirPicker">
    <button class="dir-btn" data-dir="医院类"><span class="icon">🏥</span><br>医院类</button>
    <button class="dir-btn" data-dir="新人培训类"><span class="icon">📚</span><br>新人培训类</button>
    <button class="dir-btn" data-dir="综合业务类"><span class="icon">💼</span><br>综合业务类</button>
  </div>
  <div class="msg-area" id="msgArea">
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/><path d="M11 12h2v2h-2zm0-6h2v4h-2z"/></svg>
      <p>请在顶部选择方向，<br>然后输入问题。</p>
    </div>
  </div>
  <div class="input-area">
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="输入您的问题…" onkeydown="onKeyDown(event)" oninput="autoResize(this)"></textarea>
      <button id="sendBtn" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
  <div class="error-msg" id="errorMsg"></div>
</div>

<script>
// API 地址：默认用 Cloudflare 代理，可加 ?proxy=localhost 参数启用本地代理
const API_BASE = location.search.includes('proxy=localhost') ? 'http://localhost:8888' : '';

// 节点标题 → 用户友好阶段名（按当前画布节点配置）
const NODE_LABEL = {
  '用户输入': '问题分析中',
  '方向分支': '方向识别中',
  '查询改写': '意图识别中',
  '知识检索': '知识库检索中',
  '知识检索 2': '知识库检索中',
  '知识检索 3': '知识库检索中',
  '召回检测': '质量检测中',
  '召回分支': '路由选择中',
  '医院类问答': '答案生成中',
  '新人培训问答': '答案生成中',
  '综合业务问答': '答案生成中',
  '直接回复': '整理回复中',
  '直接回复 2': '整理回复中',
  '直接回复 3': '整理回复中',
  '直接回复 4': '提示选择方向',
  '未收录回复': '提示未收录',
  '低置信回复': '提示换问法',
  '反问医院': '反问来源'
};

let curDir = '';
let convId = '';
let busy = false;
let stagesDiv = null;
let stagesList = [];

document.querySelectorAll('.dir-btn').forEach(b => b.onclick = () => {
  document.querySelectorAll('.dir-btn').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  curDir = b.dataset.dir;
  document.querySelector('.header p').textContent = '已选 · ' + curDir;
  checkSend();
  document.getElementById('input').focus();
});

function autoResize(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px';checkSend()}
function checkSend(){document.getElementById('sendBtn').disabled=!(curDir&&document.getElementById('input').value.trim()&&!busy)}
function onKeyDown(e){if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();send()}}

function addMsg(t, type){
  const area=document.getElementById('msgArea');
  const empty=document.getElementById('emptyState');
  if(empty)empty.remove();
  const d=document.createElement('div');
  d.className='msg '+type;
  d.textContent=t;
  area.appendChild(d);
  area.scrollTop=area.scrollHeight;
  return d;
}

function createStagesBox(){
  const area=document.getElementById('msgArea');
  const d=document.createElement('div');
  d.className='msg stages';
  stagesDiv=d; stagesList=[];
  area.appendChild(d);
  area.scrollTop=area.scrollHeight;
  return d;
}

function setStage(label, status){
  if(!stagesDiv) return;
  const existing = stagesList.find(s => s.label === label);
  if(existing){ existing.status = status; }
  else { stagesList.push({label, status}); }
  renderStages();
}

function renderStages(){
  if(!stagesDiv) return;
  stagesDiv.innerHTML='';
  stagesList.forEach(s => {
    const row=document.createElement('div');
    row.className='stage '+s.status;
    const dot=document.createElement('div'); dot.className='dot';
    const t=document.createElement('div'); t.textContent=s.label;
    row.appendChild(dot); row.appendChild(t);
    stagesDiv.appendChild(row);
  });
  document.getElementById('msgArea').scrollTop=999999;
}

function finishStages(){
  if(!stagesDiv) return;
  stagesList.forEach(s => { if(s.status==='active') s.status='done'; });
  renderStages();
}

function showErr(m){const e=document.getElementById('errorMsg');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',6000)}

async function send(){
  const input=document.getElementById('input');
  const q=input.value.trim();
  if(!curDir||!q||busy)return;
  busy=true;checkSend();
  addMsg(q,'user');
  input.value='';autoResize(input);
  createStagesBox();
  document.querySelector('.header p').textContent='思考中…';

  const finish = (text, err)=>{
    finishStages();
    if(stagesDiv){ stagesDiv.remove(); stagesDiv=null; }
    if(text) addMsg(text,'bot');
    if(err) showErr(err);
    busy=false;
    document.querySelector('.header p').textContent='已选 · '+curDir;
    checkSend();
  };

  try{
    const resp = await fetch(API_BASE+'/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'text/event-stream'},
      body:JSON.stringify({
        inputs:{direction:curDir},
        query:q,
        response_mode:'streaming',
        conversation_id:convId,
        user:'web'
      })
    });

    if(!resp.ok){
      const txt=await resp.text();
      let m='HTTP '+resp.status;
      try{ m=JSON.parse(txt).message||m }catch(e){}
      finish(null,'请求失败: '+m);
      return;
    }

    const reader=resp.body.getReader();
    const dec=new TextDecoder('utf-8');
    let buf='';
    let eventName='';
    let finalAnswer='';

    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n\n'))>=0){
        const raw=buf.slice(0, idx); buf=buf.slice(idx+2);
        const lines=raw.split('\n');
        let ev='', dat='';
        for(const ln of lines){
          if(ln.startsWith('event:')) ev=ln.slice(6).trim();
          else if(ln.startsWith('data:')) dat=ln.slice(5).trim();
        }
        if(!dat) continue;
        let d={};
        try{ d=JSON.parse(dat) }catch(e){}
        const e=d.event||ev;
        if(e==='node_started' || e==='node'){
          const title=d.data?.title||d.title||'';
          const label=NODE_LABEL[title];
          if(label) setStage(label,'active');
        }else if(e==='node_finished'){
          // 不变
        }else if(e==='workflow_started'){
          setStage('问题分析中','active');
        }else if(e==='workflow_finished'){
          finishStages();
        }else if(e==='message' || e==='message_end'){
          if(d.answer) finalAnswer=d.answer;
        }else if(e==='error' || e==='workflow_failed'){
          finish(null,'流程失败: '+(d.message||'未知错误'));
          return;
        }
      }
    }

    if(finalAnswer) finish(finalAnswer);
    else finish(null,'未收到回复');
  }catch(e){
    finish(null,'连接出错: '+e.message);
  }
}
</script>
</body>
</html>
